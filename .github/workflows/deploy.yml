name: Deploy backend

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "content/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # lets the job request a GitHub OIDC token for AWS

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # The AWS role only trusts this environment. Add yourself as a required reviewer
    # in Settings > Environments > production if you want to approve each deploy.
    environment: production
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -r requirements-dev.txt
      - run: python ../scripts/validate_content.py
      - run: python -m pytest -q
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-north-1
          role-session-name: taalpunt-deploy-${{ github.run_id }}
      - name: Deploy
        run: >
          npx --yes aws-cdk@2.1146.0 deploy TaalPunt
          --require-approval never
          --context alert_email=${{ vars.ALERT_EMAIL }}
          --outputs-file cdk-outputs.json
      - name: Show outputs
        run: cat cdk-outputs.json
